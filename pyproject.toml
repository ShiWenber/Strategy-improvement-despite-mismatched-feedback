[project]
name = "llm-direct"
version = "0.1.0"
description = "Experimental code for Strategy improvement despite mismatched feedback: evolving direct reciprocity with large language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "openai==2.35.1",
    "pandas==3.0.2",
    "python-dotenv==1.2.2",
    "scipy==1.17.1",
    "socksio",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["experiments*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

junit_family = "xunit1"
